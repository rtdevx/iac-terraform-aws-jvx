name: 03-14-JAVA-APP1-INFRASTRUCTURE
# NOTE: Workflow to promote Terraform environments in a linear sequence: dev -> stag -> prod

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read  # NOTE: `id-token: write` is required for OIDC role assumption; `contents: read` allows reading repository content.

env:
  AWS_ACCOUNT_ID: 390157243794
  AWS_REGION: eu-west-2    

jobs:
  # NOTE: The following jobs reuse the `03-01-java-app-main.yml` reusable workflow.
  deploy-dev:
    # NOTE: Deploy to the development environment first.
    name: Deploy to DEV
    uses: ./.github/workflows/03-01-java-app-main.yml
    with:
      environment: dev
      aws_role_arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/iac-aws-oidcRole-infra-jvx-dev
      aws_region: ${{ env.AWS_REGION }}

  deploy-stag:
    # NOTE: Deploy to staging after dev completes successfully.
    name: Deploy to STAGING
    needs: deploy-dev
    uses: ./.github/workflows/03-01-java-app-main.yml
    with:
      environment: stag
      aws_role_arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/iac-aws-oidcRole-infra-jvx-stag
      aws_region: ${{ env.AWS_REGION }}

  approve-prod:
    # NOTE: Manual approval gate before production deployment.
    name: Await Approval for PROD
    needs: deploy-stag
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://www.aws.skynetx.uk
    timeout-minutes: 10 # NOTE: Approval will time out after X mins and cancel the job
    # NOTE: This job purposefully contains only a step that represents the approval gate.
    steps:
      - name: Approval Gate
        run: echo "Waiting for manual approval before deploying to PROD"

  deploy-prod:
    # NOTE: Final production deploy runs only after manual approval.
    name: Deploy to PROD
    needs: approve-prod
    uses: ./.github/workflows/03-01-java-app-main.yml
    with:
      environment: prod
      aws_role_arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/iac-aws-oidcRole-infra-jvx-prod
      aws_region: ${{ env.AWS_REGION }}     