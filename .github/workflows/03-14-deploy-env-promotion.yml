name: 03-20-JAVA-APP1-DEPLOY-Promotion

on:
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy to DEV
    uses: ./.github/workflows/03-01-java-app-main.yml
    with:
      environment: dev
      aws_account_id: "390157243794"
      aws_region: "eu-west-2"
      terraform_version: "1.13.5"
      role_name: "iac-aws-oidcRole-infra-jvx-dev"
      tf_command: "apply"

  deploy-stag:
    name: Deploy to STAGING
    needs: deploy-dev
    uses: ./.github/workflows/03-01-java-app-main.yml
    with:
      environment: stag
      aws_account_id: "390157243794"
      aws_region: "eu-west-2"
      terraform_version: "1.13.5"
      role_name: "iac-aws-oidcRole-infra-jvx-stag"
      tf_command: "apply"

  approve-prod:
    name: Await Approval for PROD
    needs: deploy-stag
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - run: echo "Waiting for manual approval before deploying to PROD"

  deploy-prod:
    name: Deploy to PROD
    needs: approve-prod
    uses: ./.github/workflows/03-01-java-app-main.yml
    with:
      environment: prod
      aws_account_id: "390157243794"
      aws_region: "eu-west-2"
      terraform_version: "1.13.5"
      role_name: "iac-aws-oidcRole-infra-jvx-prod"
      tf_command: "apply"